# Gradle
org.gradle.jvmargs=-Xmx3072M -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configureondemand=false
org.gradle.parallel=false

# Kotlin
kotlin.code.style=official

# Android
android.useAndroidX=true
android.enableJetifier=false

# MPP
kotlin.mpp.enableCInteropCommonization=true

ksp.incremental=true

# Kotlin/JS webpack major version (Kuikly H5 uses v4-compatible config)
kotlin.js.webpack.major.version=4

# Http timeouts so a stalled dependency download fails fast instead of hanging forever
systemProp.org.gradle.internal.http.socketTimeout=60000
systemProp.org.gradle.internal.http.connectionTimeout=45000
systemProp.org.gradle.internal.repository.max.tentatives=3
